#!/usr/bin/env docker agent run

# Intent-Routed Pipeline Example
#
# Demonstrates deterministic branching inside a pipeline:
#   - `as:`  captures a structured-output agent's JSON into a named
#            variable that later steps can navigate with dotted paths.
#   - `when:` gates each branch on a CEL expression over those variables.
#
# A single classifier call decides which one of three specialists runs.
# The runtime — not an LLM — enforces "exactly one branch fires per turn".
#
# This example uses the pipeline agent AS the entry point (no LLM
# coordinator). The user's message flows straight into the classifier
# without paraphrasing, which matters because the classifier makes its
# decision from the user's exact words.
#
# Try:
#   docker agent run examples/pipeline-routing.yaml
#   > "I was charged twice last month, please refund the duplicate."
# → classifier returns {category: billing}, billing specialist answers.
#
#   > "The app crashes every time I open the settings page."
# → classifier returns {category: technical}, engineer answers.

models:
  classifier:
    provider: openai
    model: gpt-4o-mini
    temperature: 0
  worker:
    provider: openai
    model: gpt-4o-mini

agents:
  # ── Deterministic triage pipeline (entry point) ──────────────────────────────
  # No model — this agent is a pure sequencer. The runtime walks the steps
  # below in declared order. `when:` decides which branch fires.
  #
  # Because `triage` is the entry agent, {{input}} inside the pipeline is
  # the user's raw message with no intermediate paraphrasing.
  root:
    description: Support ticket classifier and router
    instruction: Classifies and routes support tickets deterministically.
    pipeline:
      # Step 0 — classifier returns JSON matching its declared schema.
      # Because `structured_output:` is declared, `as:` captures the
      # parsed object (a map), not the raw string. Downstream CEL can
      # navigate it with dotted paths: `ticket.category`.
      - agent: classifier
        as: ticket
        task: "{{input}}"

      # One of the next three steps fires. CEL variables are bare
      # (no {{ }} braces). The runtime evaluates these before running
      # each step and emits a `skipped` progress event for the false
      # branches.
      - agent: billing
        when: "ticket.category == 'billing'"
        task: "{{input}}"

      - agent: engineer
        when: "ticket.category == 'technical'"
        task: "{{input}}"

      - agent: sales
        when: "ticket.category == 'sales'"
        task: "{{input}}"

  # ── Classifier ───────────────────────────────────────────────────────────────
  # Strict structured output — OpenAI enforces the enum at decode time,
  # so `ticket.category` can only ever be one of the three listed values.
  # This is what makes the `when:` predicates safe.
  classifier:
    model: classifier
    description: Support ticket intent classifier
    instruction: |
      You classify a user's support message into EXACTLY ONE of three
      categories: billing, technical, or sales. Be decisive even when
      the message is short or contains typos — pick the best match.

      Category definitions:
        - billing    → refunds, duplicate charges, invoices, subscriptions,
                       payment failures, disputed amounts. Any mention of
                       money, cards, or billing cycles → billing.
        - technical  → bugs, crashes, errors, broken integrations, things
                       "not working", performance problems, product
                       malfunctions. Any mention of a defect or failure
                       in the product → technical.
        - sales      → pricing, plan comparisons, feature availability,
                       enterprise / team options, trials. Pre-purchase
                       questions → sales.

      Examples (the classifier must match these):
        "I was charged twice last month"     → billing / high
        "card got declined"                  → billing / normal
        "the app keeps crashing"             → technical / high
        "i have bugs" / "i have bugd"        → technical / normal
        "my product is not working"          → technical / high
        "product malfunction"                → technical / high
        "export button does nothing"         → technical / normal
        "slow performance on large files"    → technical / normal
        "what plans do you offer?"           → sales / normal
        "is SSO included in the team plan?"  → sales / low

      Urgency cues:
        - high   → "urgent", "down", "broken for everyone", "charged wrong"
        - normal → routine issues, general questions
        - low    → "no rush", "whenever you get a chance", "future"

      Return ONLY the structured JSON — no prose.
    structured_output:
      name: ticket_classification
      strict: true
      schema:
        type: object
        properties:
          category:
            type: string
            enum: [billing, technical, sales]
          urgency:
            type: string
            enum: [low, normal, high]
        required: [category, urgency]
        additionalProperties: false

  # ── Specialists ──────────────────────────────────────────────────────────────
  billing:
    model: worker
    description: Billing and refunds specialist
    instruction: |
      You handle refund, billing, and payment questions. Be precise
      about amounts and timing. If you can't resolve the issue from
      the provided information, say what would need to be escalated.

  engineer:
    model: worker
    description: Technical troubleshooting specialist
    instruction: |
      You diagnose technical issues. Ask for specifics if needed
      (version, OS, error messages). Propose concrete next steps.

  sales:
    model: worker
    description: Sales and pricing specialist
    instruction: |
      You answer pricing, plans, and feature questions. Do not quote
      numbers you don't have — suggest escalating to a human instead.
