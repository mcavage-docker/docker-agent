#!/usr/bin/env docker agent run

# Deterministic Pipeline Example
#
# Demonstrates both agent steps (LLM in a sub-session) and tool steps
# (direct tool call, no LLM) in a single pipeline.
# The pipeline starts by recalling relevant memories, then researches,
# writes, and edits — all in a guaranteed, deterministic order.

models:
  gpt:
    provider: openai
    model: gpt-4o-mini

agents:
  # ── Orchestrator ─────────────────────────────────────────────────────────────
  root:
    model: gpt
    description: Content orchestration assistant
    sub_agents:
      - content_pipeline
    instruction: |
      You are a content orchestration assistant.
      When the user asks you to write or research something, transfer the task
      to content_pipeline. Pass the user's request verbatim as the task.

  # ── Deterministic pipeline ───────────────────────────────────────────────────
  # Mixes tool steps and agent steps. The pipeline agent owns the toolsets
  # used by tool steps.
  content_pipeline:
    description: Deterministic content creation pipeline (recall → research → write → edit)
    instruction: Runs a deterministic four-step content pipeline.
    toolsets:
      - type: memory
    pipeline:
      # Step 1 — tool step: search memories for relevant context (no LLM)
      - tool: search_memories
        args:
          query: "{{input}}"

      # Step 2 — agent step: research the topic with memory context
      - agent: researcher
        task: "Research the following topic. Here is relevant context from memory:\n\n{{output}}\n\nTopic: {{input}}"

      # Step 3 — agent step: write an article from the research
      - agent: writer
        task: "Using the research below, write a well-structured, engaging article. Research:\n\n{{output}}"

      # Step 4 — agent step: polish the draft
      - agent: editor
        task: "Edit and polish the draft article below. Improve clarity, flow, and grammar without changing the meaning:\n\n{{output}}"

  # ── Worker agents ─────────────────────────────────────────────────────────────
  researcher:
    model: gpt
    description: Research specialist
    toolsets:
      - type: fetch
    instruction: |
      You are a research specialist. Extract the most important facts,
      statistics, and insights from any provided context and your own
      knowledge. Produce a structured summary with clear sections.

  writer:
    model: gpt
    description: Professional content writer
    instruction: |
      You are a professional content writer. Transform research notes into a
      polished, engaging article. Use clear headings, concrete examples, and
      an accessible tone. Target length: 400–600 words.

  editor:
    model: gpt
    description: Copy editor
    instruction: |
      You are a meticulous copy editor. Polish the draft for clarity, flow,
      and grammar. Correct any errors, improve sentence variety, and ensure
      the article reads naturally. Do not change factual content.
