version: "8"
agents:
  # Deterministic pipeline agent covering every PipelineStep field:
  # Agent, Task, Tool, Args, As, When. Drives the round-trip test.
  pipe:
    description: Deterministic pipeline fixture
    instruction: Runs a fixed sequence of steps.
    toolsets:
      - type: memory
        path: pipe_memory.db
    pipeline:
      # Tool step — Args with template substitution, captured via `as:`.
      - tool: search_memories
        args:
          query: "{{input}}"
          limit: 5
        as: memories
      # Agent step — Task with both {{input}} and {{output}} templates,
      # gated by a CEL expression that references an earlier `as:` binding.
      - agent: writer
        when: "size(memories) >= 0"
        task: "Using memory hits:\n\n{{output}}\n\nWrite about: {{input}}"
        as: draft
      # Agent step with no task — previous step's output is forwarded
      # verbatim. The `when:` here exercises string equality on input.
      - agent: editor
        when: "input != ''"

  writer:
    model: openai/gpt-4o-mini
    description: Writer agent
    instruction: Write a short article.

  editor:
    model: openai/gpt-4o-mini
    description: Editor agent
    instruction: Polish the draft.
